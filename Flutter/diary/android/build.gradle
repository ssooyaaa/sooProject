allprojects {
    repositories {
        google()
        mavenCentral()
    }

}


buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // 플러그인 의존성을 명시적으로 추가
        classpath 'com.google.gms:google-services:4.4.2' // 최신 버전으로 업데이트 가능

    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
